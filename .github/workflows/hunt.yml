# Runs the house hunter on GitHub's computers every 10 minutes, so it works
# while your laptop is off. Your email details come from the repository's
# Secrets (Settings -> Secrets and variables -> Actions), never from this file.

name: House hunter

on:
  schedule:
    # Every 10 minutes, offset from the top of the hour when GitHub is busiest.
    - cron: "4-59/10 * * * *"
  workflow_dispatch: # adds a "Run workflow" button for testing

# Never run two checks at once (they'd both email the same new listings).
concurrency:
  group: house-hunter
  cancel-in-progress: false

permissions:
  contents: write # lets it save seen.json back to the repository

jobs:
  hunt:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Check for new listings
        run: python house_hunter.py
        env:
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}

      - name: Remember what's been emailed
        run: |
          git config user.name "house-hunter"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add seen.json matches.html
          git diff --cached --quiet || git commit -m "Update seen listings"
          git pull --rebase -q && git push
